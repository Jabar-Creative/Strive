# Layanan pengembangan lokal — item F-02.
# Dijalankan dari ROOT repo: `docker compose up -d`
# (root docker-compose.yml hanya meng-`include` file ini).
#
# Port sengaja digeser dari default agar tidak bentrok dengan PostgreSQL/Redis
# yang mungkin sudah berjalan di mesin developer.

name: strive

services:
  postgres:
    image: postgres:16-alpine
    container_name: strive-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: strive
      POSTGRES_PASSWORD: strive_dev_only
      POSTGRES_DB: strive
      # citext dipakai untuk users.email (docs/PRD.md §9.3) — extension
      # dibuat di migrasi 001, bukan di sini.
      POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale=C'
    ports:
      - '127.0.0.1:55432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U strive -d strive']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: strive-redis
    restart: unless-stopped
    # appendonly hanya kenyamanan dev. Di produksi, kehilangan Redis BUKAN
    # insiden — semua isinya bisa dibangun ulang dari Postgres
    # (docs/PRD.md §8.3 aturan 1, §15.3).
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '127.0.0.1:56379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  # MinIO MENUTUP distribusi publiknya — Docker Hub (`minio/minio`) dan
  # quay.io (`quay.io/minio/minio`) dua-duanya menolak sekarang. quay.io
  # bahkan menjawab `no such manifest` untuk tag yang sebelumnya dipakai di
  # sini, jadi ini bukan rate limit melainkan tag yang ditarik.
  #
  # Yang memberi tahu kami bukan dev — mesin lokal masih punya image lama di
  # cache, jadi `docker compose up` tetap jalan. Yang merah CI, dan ia merah
  # untuk SETIAP PR.
  #
  # `chainguard/minio` adalah MinIO yang sama, dibangun ulang Chainguard:
  # entrypoint sama, `MINIO_ROOT_USER`/`MINIO_ROOT_PASSWORD` sama,
  # `/minio/health/live` sama, dan bucket tetap privat bawaan (diverifikasi:
  # health 200, GET anonim ke bucket 403).
  #
  # Dipin ke DIGEST, bukan `:latest`: tier gratis Chainguard hanya menerbitkan
  # `:latest`, dan tag yang isinya berubah diam-diam adalah cara paling halus
  # membuat CI hijau hari ini dan merah besok tanpa satu pun commit.
  minio:
    image: chainguard/minio@sha256:bd014394a80898e68c149f2311fdf8d5a2c2f3bb2c33b9327ae6d02b4b065ae1
    container_name: strive-minio
    restart: unless-stopped
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: strive
      MINIO_ROOT_PASSWORD: strive_dev_only
    ports:
      - '127.0.0.1:59000:9000' # S3 API
      - '127.0.0.1:59001:9001' # Console web
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  # Membuat tiga bucket lalu berhenti. Tiga-tiganya PRIVAT: dokumen pengguna
  # tidak pernah punya bucket publik (docs/PRD.md §12.6, §16.1).
  #
  # `aws` CLI, bukan `mc`. Alasannya sama dengan image MinIO di atas: MinIO
  # menutup distribusi publiknya, dan `mc` hilang dari Docker Hub maupun
  # quay.io sekalian. CI sudah memakai `aws` lebih dulu (dengan alasan
  # berbeda — `mc` gagal diunduh di runner), jadi ini sekaligus membuat dev
  # dan CI memakai perkakas yang SAMA. Perintah yang berbeda di dua tempat
  # adalah dua peluang berbeda untuk salah.
  #
  # `create-bucket` membuat bucket PRIVAT secara bawaan — tidak ada policy
  # yang disetel di mana pun, dan itu yang membuat §16.1 "tidak ada bucket
  # publik" benar secara konstruksi. `|| head-bucket` membuatnya idempoten.
  minio-init:
    image: amazon/aws-cli:2.22.35
    container_name: strive-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: strive
      AWS_SECRET_ACCESS_KEY: strive_dev_only
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: >
      /bin/sh -c "
      for b in strive-documents strive-assets strive-public; do
        aws --endpoint-url http://minio:9000 s3api create-bucket --bucket $$b ||
        aws --endpoint-url http://minio:9000 s3api head-bucket --bucket $$b;
      done &&
      echo '[minio-init] tiga bucket siap (semuanya privat)'
      "
    restart: 'no'

volumes:
  postgres-data:
  redis-data:
  minio-data:
