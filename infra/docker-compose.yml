# Layanan pengembangan lokal — item F-02.
# Dijalankan dari ROOT repo: `docker compose up -d`
# (root docker-compose.yml hanya meng-`include` file ini).
#
# Port sengaja digeser dari default agar tidak bentrok dengan PostgreSQL/Redis
# yang mungkin sudah berjalan di mesin developer.

name: strive

services:
  postgres:
    image: postgres:16-alpine
    container_name: strive-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: strive
      POSTGRES_PASSWORD: strive_dev_only
      POSTGRES_DB: strive
      # citext dipakai untuk users.email (docs/PRD.md §9.3) — extension
      # dibuat di migrasi 001, bukan di sini.
      POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale=C'
    ports:
      - '55432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U strive -d strive']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: strive-redis
    restart: unless-stopped
    # appendonly hanya kenyamanan dev. Di produksi, kehilangan Redis BUKAN
    # insiden — semua isinya bisa dibangun ulang dari Postgres
    # (docs/PRD.md §8.3 aturan 1, §15.3).
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '56379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  # Image MinIO diambil dari quay.io — repositori resmi mereka. Tag yang sama di
  # Docker Hub (`minio/minio`) menolak pull tanpa login.
  minio:
    image: quay.io/minio/minio:RELEASE.2024-12-18T13-15-44Z
    container_name: strive-minio
    restart: unless-stopped
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: strive
      MINIO_ROOT_PASSWORD: strive_dev_only
    ports:
      - '59000:9000' # S3 API
      - '59001:9001' # Console web
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  # Membuat tiga bucket lalu berhenti. Tiga-tiganya PRIVAT: dokumen pengguna
  # tidak pernah punya bucket publik (docs/PRD.md §12.6, §16.1).
  minio-init:
    image: quay.io/minio/mc:RELEASE.2024-11-21T17-21-54Z
    container_name: strive-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 strive strive_dev_only &&
      mc mb --ignore-existing local/strive-documents &&
      mc mb --ignore-existing local/strive-assets &&
      mc mb --ignore-existing local/strive-public &&
      echo '[minio-init] tiga bucket siap (semuanya privat)'
      "
    restart: 'no'

volumes:
  postgres-data:
  redis-data:
  minio-data:
