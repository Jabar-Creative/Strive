# Deploy staging — F-05.
#
# Urutan yang tidak boleh dibalik: migrasi, pemeriksaan skema hanya-baca,
# Railway (api, worker, ai), Vercel (web), lalu smoke. Web tidak naik sebelum
# API-nya, dan migrasi tidak jalan dari dalam image (folder db/ dan skrip
# migrasi tidak ikut ke image runtime).
#
# Pemicu `workflow_dispatch` baru bisa diklik setelah berkas ini ada di branch
# default. Deploy pertama: merge PR ini ke main. Push itu menjalankan CI;
# CI yang hijau di main memicu workflow ini lewat `workflow_run`.
name: Deploy staging

on:
  workflow_dispatch:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]

# Satu deploy pada satu waktu. Jangan batalkan yang sedang berjalan:
# migrasi yang terputus di tengah unggahan lebih sulit dibaca daripada antrean.
concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '9.15.0'
  # Project token di secret RAILWAY_TOKEN sudah terikat ke project
  # strive-staging dan environment staging. Id di sini supaya log menyebut
  # service yang sama dengan dashboard, bukan nama yang bisa tertukar.
  RAILWAY_PROJECT_ID: 773fa4e1-589a-4afb-a559-80cfe632f1a5
  RAILWAY_ENVIRONMENT_ID: f21ad5e8-4c7c-4600-b20b-7fc12232f860
  RAILWAY_SERVICE_API: 48a85756-590e-4bb1-8334-a6df074749dc
  RAILWAY_SERVICE_WORKER: 402d7883-6db0-4776-b2ea-64ef663da55b
  RAILWAY_SERVICE_AI: da5d0d35-3116-49d1-9237-0b62ee51db04
  API_HEALTH_URL: https://api-staging-af8c.up.railway.app/health
  AI_HEALTH_URL: https://ai-staging-330d.up.railway.app/health
  WEB_URL: https://strive-staging-web.vercel.app/

jobs:
  migrasi:
    # `workflow_run` menyala untuk SETIAP CI yang selesai di main, termasuk
    # yang gagal. Deploy hanya boleh jalan kalau CI hijau, atau manusia
    # menekan workflow_dispatch pada main (commit di main sudah melewati
    # status check wajib sebelum bisa masuk — force-push ke main dilarang).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Migrasi staging
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: pnpm db:migrate

      - name: Periksa skema — hanya baca
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: node scripts/schema-check-readonly.mjs

  railway:
    needs: migrasi
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Pasang Railway CLI
        run: npm install -g @railway/cli@5.62.1 && railway --version

      - name: Deploy api, worker, lalu ai
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          set -euo pipefail
          trap 'rm -f railway.json' EXIT
          # `--ci` keluar non-nol kalau build gagal, dan kembali saat build
          # selesai — bukan saat proses baru sudah menjawab /health. Smoke
          # di bawah yang menunggu jawabannya.
          # railway.json disalin per service supaya Dockerfile-nya tidak
          # tertukar. Berkas itu tidak di-commit; sumbernya infra/railway/.
          # Urutan tetap api, lalu worker, lalu ai. Kegagalan tetap
          # menghentikan yang berikutnya (`set -e` lewat `exit 1`) — yang
          # berubah hanya pesan: nama service tertulis di log, bukan cuma
          # baris perintah yang keluar non-nol. Smoke di job berikut tetap
          # gerbang /health; langkah ini tidak menunggu sehat dan tidak
          # melonggarkannya.
          deploy() {
            nama="$1"
            layanan="$2"
            sumber="$3"
            echo "mulai unggah Railway: ${nama} (${layanan})"
            cp "$sumber" railway.json
            if ! railway up --ci --service "$layanan" --environment "$RAILWAY_ENVIRONMENT_ID"; then
              echo "::error::Unggah Railway gagal untuk ${nama} (${layanan}). Service berikutnya tidak diunggah."
              exit 1
            fi
            rm -f railway.json
            echo "unggah Railway selesai: ${nama}"
          }
          deploy api "$RAILWAY_SERVICE_API" infra/railway/api.json
          deploy worker "$RAILWAY_SERVICE_WORKER" infra/railway/worker.json
          deploy ai "$RAILWAY_SERVICE_AI" infra/railway/ai.json

  web:
    needs: railway
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Pasang Vercel CLI
        run: npm install -g vercel@60.0.1 && vercel --version

      - name: Bangun dan deploy web
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          # Token dibaca dari env. Jangan taruh --token di argv: ia muncul
          # di daftar proses. `.vercel/` memuat VERCEL_OIDC_TOKEN — jangan
          # diunggah sebagai artifact, dan jangan dicetak.
          vercel pull --yes --environment=production
          vercel build --prod
          vercel deploy --prebuilt --prod

      - name: Hapus .vercel
        if: always()
        run: rm -rf .vercel

  smoke:
    needs: web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Health API, AI, dan beranda web
        run: |
          set -euo pipefail
          tunggu_json() {
            url="$1"
            pola="$2"
            for i in $(seq 1 30); do
              badan=$(curl -fsS --max-time 15 "$url" 2>/dev/null || true)
              if printf '%s' "$badan" | grep -Eq "$pola"; then
                printf '%s\n' "$badan"
                return 0
              fi
              echo "menunggu $url ($i/30)"
              sleep 10
            done
            echo "::error::tidak sehat: $url"
            return 1
          }
          tunggu_json "$API_HEALTH_URL" '"service"[[:space:]]*:[[:space:]]*"api"'
          tunggu_json "$AI_HEALTH_URL" '"service"[[:space:]]*:[[:space:]]*"ai"'
          for i in $(seq 1 30); do
            kode=$(curl -sS -o /tmp/web-body -w '%{http_code}' --max-redirs 0 --max-time 20 "$WEB_URL" || true)
            if [ "$kode" = "200" ]; then
              echo "web HTTP 200"
              head -c 180 /tmp/web-body
              echo
              rm -f /tmp/web-body
              exit 0
            fi
            echo "menunggu web kode=${kode} ($i/30)"
            sleep 10
          done
          echo "::error::web bukan HTTP 200 tanpa redirect (cek Deployment Protection)"
          exit 1
