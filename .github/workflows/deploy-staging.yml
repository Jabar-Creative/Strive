# Deploy staging — F-05.
#
# Urutan yang tidak boleh dibalik: migrasi, pemeriksaan skema hanya-baca,
# Railway (api, worker, ai), Vercel (web), lalu smoke. Web tidak naik sebelum
# API-nya, dan migrasi tidak jalan dari dalam image (folder db/ dan skrip
# migrasi tidak ikut ke image runtime).
#
# Pemicu `workflow_dispatch` baru bisa diklik setelah berkas ini ada di branch
# default. Deploy pertama: merge PR ini ke main. Push itu menjalankan CI;
# CI yang hijau di main memicu workflow ini lewat `workflow_run`.
name: Deploy staging

on:
  workflow_dispatch:
    inputs:
      semai:
        description: 'Semai konten ke database staging (pnpm seed + seed:content). Idempoten, hanya INSERT ... ON CONFLICT DO NOTHING.'
        type: boolean
        default: false
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]

# Satu deploy pada satu waktu. Jangan batalkan yang sedang berjalan: migrasi
# yang terputus di tengah unggahan lebih sulit dibaca daripada antrean.
#
# TAPI "antrean" di sini berkapasitas SATU, dan itu bukan yang dulu diduga
# baris ini. GitHub hanya menyimpan satu run `pending` per grup: run pending
# yang BARU membatalkan yang lama. Saat satu `railway up` menggantung 50 menit
# (25 Sep), tiga merge berikutnya masuk-keluar antrean dan dua perbaikan tidak
# pernah ter-deploy — riwayatnya cuma tertulis `cancelled`, tidak ada yang
# merah. Isu #165. Batas waktu per service di bawah yang menutup sebabnya;
# kapasitas antrean ini tidak bisa diubah dari sini.
concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '9.15.0'
  # Project token di secret RAILWAY_TOKEN sudah terikat ke project
  # strive-staging dan environment staging. Id di sini supaya log menyebut
  # service yang sama dengan dashboard, bukan nama yang bisa tertukar.
  RAILWAY_PROJECT_ID: 773fa4e1-589a-4afb-a559-80cfe632f1a5
  RAILWAY_ENVIRONMENT_ID: f21ad5e8-4c7c-4600-b20b-7fc12232f860
  RAILWAY_SERVICE_API: 48a85756-590e-4bb1-8334-a6df074749dc
  RAILWAY_SERVICE_WORKER: 402d7883-6db0-4776-b2ea-64ef663da55b
  RAILWAY_SERVICE_AI: da5d0d35-3116-49d1-9237-0b62ee51db04
  API_HEALTH_URL: https://api-staging-af8c.up.railway.app/health
  AI_HEALTH_URL: https://ai-staging-330d.up.railway.app/health
  WEB_URL: https://strive-staging-web.vercel.app/

jobs:
  migrasi:
    # `workflow_run` menyala untuk SETIAP CI yang selesai di main, termasuk
    # yang gagal. Deploy hanya boleh jalan kalau CI hijau, atau manusia
    # menekan workflow_dispatch pada main (commit di main sudah melewati
    # status check wajib sebelum bisa masuk — force-push ke main dilarang).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Migrasi staging
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: pnpm db:migrate

      - name: Periksa skema — hanya baca
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: node scripts/schema-check-readonly.mjs

      # Hanya lewat workflow_dispatch dengan centang `semai`. TIDAK pernah
      # otomatis: staging punya database permanen, dan langkah yang menulis
      # ke sana pada setiap push adalah langkah yang suatu saat menulis
      # sesuatu yang tidak diniatkan.
      #
      # Aman dijalankan berkali-kali secara KONSTRUKSI, bukan karena
      # hati-hati: kedua seeder hanya `INSERT ... ON CONFLICT DO NOTHING`,
      # tidak pernah UPDATE dan tidak pernah DELETE. `pricing_config` bahkan
      # hanya disemai kalau tabelnya kosong, supaya versi aktif tidak
      # melompat dan order lama tidak menunjuk harga yang bukan harganya.
      #
      # Ini BUKAN pelanggaran "jangan menulis SQL ke staging" (#151): yang
      # dilarang di sana adalah mengarang data supaya layar terlihat ramai.
      # Semai konten adalah perkakas resmi repo ini (F-13, F-11), dan tanpa
      # konten tidak ada lesson untuk dikerjakan — V11 tidak bisa dijalankan
      # sama sekali.
      - name: Semai konten staging
        if: ${{ inputs.semai }}
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: |
          set -euo pipefail
          pnpm seed
          pnpm seed:content db/seeds/content/contoh-track.json

      # Membuktikan semainya BERISI, bukan sekadar keluar 0. Seeder yang
      # idempoten akan tetap keluar 0 kalau ia gagal menyisipkan apa pun,
      # jadi "perintahnya sukses" bukan bukti datanya ada.
      - name: Buktikan konten ada — hanya baca
        if: ${{ inputs.semai }}
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: node scripts/schema-check-readonly.mjs --hitung-konten

  railway:
    needs: migrasi
    runs-on: ubuntu-latest
    # 30, bukan 90. Deploy sehat 6-7 menit untuk ketiganya; 90 menit bukan
    # batas melainkan menyerah, dan selama itu seluruh pipeline terblokir
    # sementara run berikutnya dibatalkan diam-diam (#165). Batas per service
    # di bawah yang memberi pesannya; ini jaring terakhir.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Pasang Railway CLI
        run: npm install -g @railway/cli@5.62.1 && railway --version

      - name: Deploy api, worker, lalu ai
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          set -euo pipefail
          trap 'rm -f railway.json' EXIT
          # `--ci` keluar non-nol kalau build gagal, dan kembali saat build
          # selesai — bukan saat proses baru sudah menjawab /health. Smoke
          # di bawah yang menunggu jawabannya.
          # railway.json disalin per service supaya Dockerfile-nya tidak
          # tertukar. Berkas itu tidak di-commit; sumbernya infra/railway/.
          # Urutan tetap api, lalu worker, lalu ai. Kegagalan tetap
          # menghentikan yang berikutnya (`set -e` lewat `exit 1`) — yang
          # berubah hanya pesan: nama service tertulis di log, bukan cuma
          # baris perintah yang keluar non-nol. Smoke di job berikut tetap
          # gerbang /health; langkah ini tidak menunggu sehat dan tidak
          # melonggarkannya.
          # Batas per service, bukan cuma batas job. Tanpa ini, satu `railway up`
          # yang menggantung membuat job diam sampai timeout-nya dan log-nya
          # tidak menyebut service mana yang berhenti bergerak — persis yang
          # terjadi 25 Sep. `timeout` keluar 124 saat waktunya habis, dan itu
          # DIBEDAKAN dari build yang gagal: keduanya sama-sama menghentikan
          # deploy, tapi yang dicari orang berikutnya berbeda.
          BATAS_DETIK=600
          deploy() {
            nama="$1"
            layanan="$2"
            sumber="$3"
            echo "mulai unggah Railway: ${nama} (${layanan}) — batas ${BATAS_DETIK} detik"
            mulai=$SECONDS
            cp "$sumber" railway.json
            kode=0
            timeout "${BATAS_DETIK}" railway up --ci --service "$layanan" --environment "$RAILWAY_ENVIRONMENT_ID" || kode=$?
            lama=$((SECONDS - mulai))
            if [ "$kode" = "124" ]; then
              echo "::error::Unggah Railway MENGGANTUNG untuk ${nama} (${layanan}): tidak selesai dalam ${BATAS_DETIK} detik. Deploy sehat 6-7 menit untuk ketiganya — periksa antrean build Railway, bukan kode. Service berikutnya tidak diunggah."
              exit 1
            fi
            if [ "$kode" != "0" ]; then
              echo "::error::Unggah Railway GAGAL untuk ${nama} (${layanan}) setelah ${lama} detik, keluar ${kode}. Service berikutnya tidak diunggah."
              exit 1
            fi
            rm -f railway.json
            echo "unggah Railway selesai: ${nama} (${lama} detik)"
          }
          deploy api "$RAILWAY_SERVICE_API" infra/railway/api.json
          deploy worker "$RAILWAY_SERVICE_WORKER" infra/railway/worker.json
          deploy ai "$RAILWAY_SERVICE_AI" infra/railway/ai.json

  web:
    needs: railway
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Pasang Vercel CLI
        run: npm install -g vercel@60.0.1 && vercel --version

      - name: Bangun dan deploy web
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          # Token dibaca dari env. Jangan taruh --token di argv: ia muncul
          # di daftar proses. `.vercel/` memuat VERCEL_OIDC_TOKEN — jangan
          # diunggah sebagai artifact, dan jangan dicetak.
          vercel pull --yes --environment=production
          vercel build --prod
          vercel deploy --prebuilt --prod

      - name: Hapus .vercel
        if: always()
        run: rm -rf .vercel

  smoke:
    needs: web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Health API, AI, dan beranda web
        run: |
          set -euo pipefail
          tunggu_json() {
            url="$1"
            pola="$2"
            for i in $(seq 1 30); do
              badan=$(curl -fsS --max-time 15 "$url" 2>/dev/null || true)
              if printf '%s' "$badan" | grep -Eq "$pola"; then
                printf '%s\n' "$badan"
                return 0
              fi
              echo "menunggu $url ($i/30)"
              sleep 10
            done
            echo "::error::tidak sehat: $url"
            return 1
          }
          tunggu_json "$API_HEALTH_URL" '"service"[[:space:]]*:[[:space:]]*"api"'
          tunggu_json "$AI_HEALTH_URL" '"service"[[:space:]]*:[[:space:]]*"ai"'
          for i in $(seq 1 30); do
            kode=$(curl -sS -o /tmp/web-body -w '%{http_code}' --max-redirs 0 --max-time 20 "$WEB_URL" || true)
            if [ "$kode" = "200" ]; then
              echo "web HTTP 200"
              head -c 180 /tmp/web-body
              echo
              rm -f /tmp/web-body
              exit 0
            fi
            echo "menunggu web kode=${kode} ($i/30)"
            sleep 10
          done
          echo "::error::web bukan HTTP 200 tanpa redirect (cek Deployment Protection)"
          exit 1
