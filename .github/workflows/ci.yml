name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Target: seluruh CI < 5 menit (docs/PRD.md §15.1, item F-03).
  NODE_VERSION: '22'
  PNPM_VERSION: '9.15.0'

jobs:
  node:
    name: lint · typecheck · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  ai:
    name: ai service · test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/ai/requirements.txt

      - run: pip install -r services/ai/requirements.txt
        working-directory: services/ai

      - run: pytest -q
        working-directory: services/ai

  # Membuktikan skema bisa berdiri DARI NOL, bukan hanya dari database yang
  # sudah ada di mesin seseorang (item F-03).
  migrations:
    name: migrasi kering
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: strive
          POSTGRES_PASSWORD: strive_ci
          POSTGRES_DB: strive_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U strive -d strive_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Jalankan migrasi terhadap DB kosong
        env:
          DATABASE_URL: postgres://strive:strive_ci@localhost:5432/strive_ci
        run: pnpm db:migrate
