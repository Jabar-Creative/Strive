name: CI

on:
  push:
    branches: [main]
  # SETIAP pull request, bukan hanya yang menargetkan `main`.
  #
  # Sebelumnya di sini tertulis `branches: [main]`, dan akibatnya PR bertumpuk
  # (PR yang base-nya branch lain) TIDAK mendapat CI sama sekali — bukan merah,
  # tapi kosong. Ketahuan saat mencoba membuktikan acceptance criteria F-03
  # "PR menjadi merah kalau salah satu gagal": PR yang sengaja dibuat gagal
  # justru tidak melaporkan status apa pun.
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Target: seluruh CI < 5 menit (docs/PRD.md §15.1, item F-03).
  NODE_VERSION: '22'
  PNPM_VERSION: '9.15.0'

jobs:
  node:
    name: lint · typecheck · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # F-05. Skrip yang nanti jalan ke database staging wajib terbukti
      # menolak INSERT/UPDATE/DELETE tanpa membuka koneksi. Kalau penjaga
      # ini hilang, job deploy bisa menulis coin_ledger ke staging.
      - name: Penjaga skema staging hanya baca
        run: node scripts/schema-check-readonly.mjs --periksa-query

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # R-03, PRD §16.1 "Dependency audit nol kerentanan tinggi".
      # Bukan `pnpm audit` mentah: setiap advisory tinggi/kritis yang
      # dibiarkan WAJIB tertulis di security/pengecualian.json dengan
      # alasannya dan tanggal tinjau ulang. Advisory BARU dan pengecualian
      # yang kedaluwarsa sama-sama memerahkan langkah ini.
      - name: Audit dependensi
        run: pnpm audit:kebijakan

  ai:
    name: ai service · test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/ai/requirements.txt

      # Path relatif terhadap working-directory, bukan terhadap root repo.
      - run: pip install -r requirements.txt
        working-directory: services/ai

      - run: pytest -q
        working-directory: services/ai

  # Membuktikan skema bisa berdiri DARI NOL, bukan hanya dari database yang
  # sudah ada di mesin seseorang (item F-03).
  migrations:
    name: migrasi kering
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: strive
          POSTGRES_PASSWORD: strive_ci
          POSTGRES_DB: strive_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U strive -d strive_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
      # Redis ditambahkan di Q-02. Test leaderboard menguji AC yang berbunyi
      # "Redis di-FLUSHALL lalu papan pulih otomatis" — itu tidak bisa
      # dibuktikan dengan mock: mock akan selalu "pulih", karena datanya
      # memang tidak pernah benar-benar hilang.
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # MinIO ditambahkan di K-01, alasan yang sama dengan Redis di Q-02: AC-nya
      # berbunyi "tipe berkas lain ditolak SEBELUM menyentuh storage", dan itu
      # tidak bisa dibuktikan dengan mock — mock akan selalu "tidak menyimpan
      # apa pun", karena memang tidak ada storage yang disentuh.
      #
      # `docker run`, BUKAN entri `services:`. GitHub Actions tidak bisa
      # menimpa command container layanan, sementara image MinIO butuh
      # `server /data`. Tanpa itu ia mencetak layar bantuan lalu keluar, dan
      # kegagalannya muncul sebagai "unhealthy" yang tidak menyebut sebabnya.
      - name: Jalankan MinIO + siapkan bucket
        run: |
          set -euo pipefail
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=strive -e MINIO_ROOT_PASSWORD=strive_ci_only \
            chainguard/minio@sha256:bd014394a80898e68c149f2311fdf8d5a2c2f3bb2c33b9327ae6d02b4b065ae1 server /data

          # Tunggu API-nya SIAP, bukan tunggu sekian detik. `sleep` yang cukup
          # hari ini adalah `sleep` yang kurang di runner yang lebih lambat.
          for i in $(seq 1 60); do
            curl -sf http://localhost:9000/minio/health/live && break
            [ "$i" = 60 ] && { echo "::error::MinIO tidak siap dalam 60 detik"; docker logs minio; exit 1; }
            sleep 1
          done

          # Bucket dibuat DI SINI, bukan di test: test yang membuat bucketnya
          # sendiri akan lulus meski GRANT-nya salah, karena ia pemiliknya.
          #
          # `aws` CLI, bukan `mc`. Mengunduh `mc` dari dl.min.io sempat dicoba
          # dan gagal: servernya membalas 410, curl menyimpan badan galatnya
          # sebagai "binary", dan kegagalannya muncul sebagai
          # `mc: line 1: 410: command not found` — pesan yang tidak menyebut
          # unduhan sama sekali. `aws` sudah terpasang di runner ubuntu-latest,
          # jadi tidak ada yang perlu diunduh.
          export AWS_ACCESS_KEY_ID=strive AWS_SECRET_ACCESS_KEY=strive_ci_only
          export AWS_DEFAULT_REGION=us-east-1
          for b in strive-documents strive-assets; do
            aws --endpoint-url http://localhost:9000 s3api create-bucket --bucket "$b" \
              || aws --endpoint-url http://localhost:9000 s3api head-bucket --bucket "$b"
          done

      - name: Jalankan migrasi terhadap DB kosong
        env:
          DATABASE_URL: postgres://strive:strive_ci@localhost:5432/strive_ci
          REDIS_URL: redis://localhost:6379
        run: pnpm db:migrate

      # Migrasi yang "tidak error" belum membuktikan skemanya benar. Tiga hal
      # di bawah ini yang benar-benar diperiksa.
      - name: Verifikasi skema hasil migrasi
        env:
          PGPASSWORD: strive_ci
        run: |
          set -euo pipefail
          q() { psql -h localhost -U strive -d strive_ci -tAc "$1"; }

          tables=$(q "SELECT count(*) FROM information_schema.tables
                      WHERE table_schema='public' AND table_type='BASE TABLE'
                        AND table_name NOT LIKE 'lesson_attempts\_%';")
          echo "tabel domain: $tables"
          # 33 → 32 sejak migrasi 007: `refresh_tokens` dibuang (isu #47).
          test "$tables" = "32" || { echo "::error::harus 32 tabel domain (docs/PRD.md §9.1), dapat $tables"; exit 1; }

          trg=$(q "SELECT count(*) FROM pg_trigger WHERE tgname='coin_ledger_no_mutate';")
          test "$trg" = "1" || { echo "::error::trigger append-only coin_ledger tidak ada"; exit 1; }

          # Trigger harus benar-benar MENOLAK, bukan sekadar terdaftar.
          #
          # Satu baris disisipkan dulu, dan itu bukan formalitas: trigger ini
          # FOR EACH ROW, jadi UPDATE pada tabel KOSONG menyentuh nol baris,
          # tidak pernah menyalakan trigger, dan psql keluar 0. Versi pertama
          # pemeriksaan ini jatuh persis di situ — lulus karena salah, bukan
          # karena benar.
          q "INSERT INTO users (id, email, display_name)
             VALUES ('00000000-0000-4000-8000-0000000000c1', 'ci@strive.test', 'CI');" >/dev/null
          q "INSERT INTO coin_ledger (user_id, entry_type, amount, balance_after)
             VALUES ('00000000-0000-4000-8000-0000000000c1', 'adjust', 1, 1);" >/dev/null

          rows=$(q "SELECT count(*) FROM coin_ledger;")
          test "$rows" = "1" || { echo "::error::baris uji gagal disisipkan, pemeriksaan trigger tidak sahih"; exit 1; }

          if q "UPDATE coin_ledger SET amount = 999;" 2>/dev/null; then
            echo "::error::UPDATE coin_ledger TIDAK ditolak — trigger append-only tidak bekerja"; exit 1
          fi
          if q "DELETE FROM coin_ledger;" 2>/dev/null; then
            echo "::error::DELETE coin_ledger TIDAK ditolak — trigger append-only tidak bekerja"; exit 1
          fi
          echo "trigger append-only menolak UPDATE dan DELETE pada baris sungguhan: benar"

          # ── isu #26: kapasitas squad ditegakkan database, bukan cuma service ──
          #
          # Pelajaran yang sama seperti di atas: trigger yang cuma TERDAFTAR tidak
          # membuktikan apa pun. Squad diisi sampai penuh dengan baris sungguhan,
          # baru anggota berikutnya dicoba.
          q "INSERT INTO league_seasons (id, code, starts_at, ends_at)
             VALUES ('00000000-0000-4000-8000-0000000000d1','CI-W1', now(), now() + interval '7 days');" >/dev/null
          q "INSERT INTO squads (id, name, season_id, max_members)
             VALUES ('00000000-0000-4000-8000-0000000000d2','CI','00000000-0000-4000-8000-0000000000d1', 8);" >/dev/null
          q "INSERT INTO users (id, email, display_name)
             SELECT ('00000000-0000-4000-8000-0000000000e' || i)::uuid, 'ci'||i||'@strive.test','CI'||i
             FROM generate_series(1,9) i;" >/dev/null
          q "INSERT INTO squad_members (squad_id, user_id)
             SELECT '00000000-0000-4000-8000-0000000000d2', ('00000000-0000-4000-8000-0000000000e' || i)::uuid
             FROM generate_series(1,8) i;" >/dev/null

          anggota=$(q "SELECT count(*) FROM squad_members WHERE left_at IS NULL;")
          test "$anggota" = "8" || { echo "::error::baris uji squad gagal disisipkan ($anggota), pemeriksaan tidak sahih"; exit 1; }

          if q "INSERT INTO squad_members (squad_id, user_id)
                VALUES ('00000000-0000-4000-8000-0000000000d2','00000000-0000-4000-8000-0000000000e9');" 2>/dev/null; then
            echo "::error::anggota ke-9 TIDAK ditolak — trigger kapasitas squad tidak bekerja"; exit 1
          fi
          echo "trigger kapasitas squad menolak anggota melebihi max_members: benar"

          # ── isu #15: FK peer_reviews -> lesson_attempts ──
          fk=$(q "SELECT count(*) FROM pg_constraint WHERE conname='peer_reviews_attempt_fk';")
          test "$fk" = "1" || { echo "::error::FK peer_reviews_attempt_fk tidak ada"; exit 1; }

          if q "INSERT INTO peer_reviews (attempt_id, attempt_date, reviewer_id, author_id, rubric_scores)
                VALUES (gen_random_uuid(), current_date,
                        '00000000-0000-4000-8000-0000000000e1',
                        '00000000-0000-4000-8000-0000000000e2', '{}');" 2>/dev/null; then
            echo "::error::peer_review ke attempt fantom TIDAK ditolak — FK tidak bekerja"; exit 1
          fi
          echo "FK peer_reviews menolak attempt yang tidak ada: benar"

      # Kalau skema berubah tapi `pnpm db:types` lupa dijalankan, tipe di repo
      # jadi bohong dan tidak ada yang tahu sampai ada bug aneh di runtime.
      # Jalur uang WAJIB punya test integrasi dengan database NYATA
      # (CLAUDE.md §Test). Job inilah satu-satunya yang punya PostgreSQL, jadi
      # di sinilah test itu dijalankan — bukan dilewati diam-diam di job `node`.
      - name: Test integrasi jalur uang
        env:
          DATABASE_URL: postgres://strive:strive_ci@localhost:5432/strive_ci
          REDIS_URL: redis://localhost:6379
          S3_ENDPOINT: http://localhost:9000
          S3_ACCESS_KEY: strive
          S3_SECRET_KEY: strive_ci_only
          S3_BUCKET_DOCUMENTS: strive-documents
        run: pnpm --filter @strive/api test:integration

      - name: Tipe Kysely harus sinkron dengan skema
        env:
          DATABASE_URL: postgres://strive:strive_ci@localhost:5432/strive_ci
          REDIS_URL: redis://localhost:6379
        run: |
          pnpm db:types
          git diff --exit-code -- apps/api/src/infra/kysely/database.d.ts \
            || { echo "::error::database.d.ts tidak sinkron dengan db/migrations — jalankan \`pnpm db:types\` lalu commit"; exit 1; }

  # Image produksi tidak pernah dibangun di job lain. `nest build` di host
  # memakai node_modules workspace; kegagalan Railway pertama adalah image
  # yang hasil build-nya tidak melihat dependensi itu (MODULE_NOT_FOUND
  # `reflect-metadata` dari `/app/dist/main.js`). Job ini membangun image
  # runtime dan menyalakannya. Worker memakai Dockerfile yang sama.
  #
  # Nama job ini BELUM masuk status check wajib di branch protection (setelan
  # itu di luar repo). Workflow `CI` yang gagal tetap menahan `workflow_run`
  # deploy. Yang belum tertahan: merge, selama tiga check lama tetap hijau.
  image:
    name: image runtime
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Bangun image api dan ai
        run: |
          set -euo pipefail
          docker build -f infra/Dockerfile.api -t strive-api:ci .
          docker build -f infra/Dockerfile.ai -t strive-ai:ci .

      - name: Modul terselesaikan dari cwd image api
        run: |
          set -euo pipefail
          docker run --rm --entrypoint node strive-api:ci -e '
            const fs = require("fs");
            const path = require("path");
            require("reflect-metadata");
            require("@nestjs/core");
            require("@node-rs/argon2");
            const resolved = require.resolve("@strive/contracts");
            let dir = path.dirname(resolved);
            let nama = "";
            while (dir !== path.dirname(dir)) {
              const pj = path.join(dir, "package.json");
              if (fs.existsSync(pj)) {
                const pkg = JSON.parse(fs.readFileSync(pj, "utf8"));
                if (pkg.name === "@strive/contracts") { nama = pkg.name; break; }
              }
              dir = path.dirname(dir);
            }
            if (nama !== "@strive/contracts") {
              console.error("kontrak tidak terselesaikan dari image:", resolved);
              process.exit(1);
            }
            console.log("modul-ok", resolved);
          '

      - name: API /health dan worker dari image yang sama
        run: |
          set -euo pipefail
          bersih() { docker rm -f api-image worker-image redis-image >/dev/null 2>&1 || true; }
          trap bersih EXIT
          docker run -d --name redis-image -p 127.0.0.1:6379:6379 redis:7-alpine
          for i in $(seq 1 30); do
            docker exec redis-image redis-cli ping | grep -q PONG && break
            if [ "$i" = 30 ]; then echo "::error::Redis untuk boot image tidak siap"; exit 1; fi
            sleep 1
          done
          # Bukan rahasia staging. Panjangnya hanya supaya Better-Auth mau boot
          # sampai /health. Postgres tidak dijalankan: /health tidak menyentuhnya,
          # dan pool pg baru menyambung saat ada query.
          bersama=(
            --network host
            -e NODE_ENV=production
            -e DATABASE_URL=postgres://ci:ci@127.0.0.1:1/none
            -e REDIS_URL=redis://127.0.0.1:6379
            -e AUTH_SECRET=image-ci-bukan-rahasia-min-32-byte
            # Alasan yang SAMA dengan AUTH_SECRET di atas: storage gagal
            # TERTUTUP di produksi. Tanpa ketiganya, `createS3FromEnv()`
            # melempar saat boot supaya produksi tidak pernah diam-diam
            # memakai MinIO lokal dengan password yang ada di repo publik.
            # Nilai di bawah cukup untuk MEMBUKTIKAN IMAGE BOOT — job ini
            # tidak menyentuh storage sama sekali.
            -e S3_ENDPOINT=http://127.0.0.1:1
            -e S3_ACCESS_KEY=image-ci
            -e S3_SECRET_KEY=image-ci-bukan-rahasia
            -e API_PORT=3001
          )
          docker run -d --name api-image "${bersama[@]}" -e MODE=api strive-api:ci
          for i in $(seq 1 40); do
            if curl -fsS --max-time 2 http://127.0.0.1:3001/health | grep -Eq '"service"[[:space:]]*:[[:space:]]*"api"'; then
              echo "api-health-ok"
              break
            fi
            if ! docker inspect -f '{{.State.Running}}' api-image | grep -q true; then
              echo "::error::proses api mati sebelum /health"
              docker logs api-image
              exit 1
            fi
            if [ "$i" = 40 ]; then
              echo "::error::API tidak menjawab /health"
              docker logs api-image
              exit 1
            fi
            sleep 1
          done
          docker run -d --name worker-image "${bersama[@]}" -e MODE=worker strive-api:ci
          for i in $(seq 1 40); do
            if docker logs worker-image 2>&1 | grep -q 'Worker pool hidup'; then
              docker inspect -f '{{.State.Running}}' worker-image | grep -q true
              echo "worker-ok"
              break
            fi
            if ! docker inspect -f '{{.State.Running}}' worker-image | grep -q true; then
              echo "::error::proses worker mati sebelum pool hidup"
              docker logs worker-image
              exit 1
            fi
            if [ "$i" = 40 ]; then
              echo "::error::worker tidak mencatat pool hidup"
              docker logs worker-image
              exit 1
            fi
            sleep 1
          done

      - name: Image ai menjawab /health
        run: |
          set -euo pipefail
          bersih() { docker rm -f ai-image >/dev/null 2>&1 || true; }
          trap bersih EXIT
          docker run -d --name ai-image -p 127.0.0.1:8000:8000 strive-ai:ci
          for i in $(seq 1 40); do
            if curl -fsS --max-time 2 http://127.0.0.1:8000/health | grep -Eq '"service"[[:space:]]*:[[:space:]]*"ai"'; then
              echo "ai-health-ok"
              exit 0
            fi
            if ! docker inspect -f '{{.State.Running}}' ai-image | grep -q true; then
              echo "::error::proses ai mati sebelum /health"
              docker logs ai-image
              exit 1
            fi
            if [ "$i" = 40 ]; then
              echo "::error::AI tidak menjawab /health"
              docker logs ai-image
              exit 1
            fi
            sleep 1
          done
