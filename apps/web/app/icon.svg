<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Strive">
  <!--
    Ikon aplikasi. Warnanya indigo-600 (#4F3DE8), warna merek di docs/PRD.md §14.1.
